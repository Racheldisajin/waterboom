# Rate limiting zone: max 15 requests/sec per IP, burst 30
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Internal Docker DNS resolver
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $postgrest_backend http://postgrest-cijoho:3000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy Supabase REST protocol ke PostgREST dengan Rate Limiting
    location /rest/v1/ {
        limit_req zone=api_limit burst=30 nodelay;

        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass $postgrest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Teruskan Authorization & apikey header untuk autentikasi JWT role PostgREST
        proxy_pass_header Authorization;
        proxy_pass_header apikey;
    }

    # Proxy endpoint /api/ ke PostgREST dengan Rate Limiting
    location /api/ {
        limit_req zone=api_limit burst=30 nodelay;

        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $postgrest_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass_header Authorization;
        proxy_pass_header apikey;
    }
}
